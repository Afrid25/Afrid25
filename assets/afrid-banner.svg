<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Afrid - Full-Stack Web Developer in Progress, CSE student at IIUC, Founder of Bookeeds" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0d2a4a"/>
      <stop offset="1" stop-color="#0e75b6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: 'Fira Code', 'Cascadia Code', Consolas, Menlo, monospace; font-size: 16px; }
      .rise { opacity: 0; animation: rise 0.9s ease-out forwards; }
      .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.5s; }
      .d3 { animation-delay: 0.8s; } .d4 { animation-delay: 1.1s; }
      .l1 { animation-delay: 0.6s; } .l2 { animation-delay: 1.0s; } .l3 { animation-delay: 1.4s; }
      .l4 { animation-delay: 1.8s; } .l5 { animation-delay: 2.2s; } .l6 { animation-delay: 2.6s; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>

  <circle cx="1010" cy="40" r="150" fill="#38bdf8" fill-opacity="0.10">
    <animate attributeName="cy" values="40;70;40" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="270" r="120" fill="#818cf8" fill-opacity="0.14">
    <animate attributeName="cy" values="270;240;270" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g class="t">
    <text x="64" y="125" font-size="64" font-weight="800" fill="#ffffff" class="rise d1">Hi, I'm Afrid</text>
    <text x="66" y="165" font-size="22" fill="#93c5fd" class="rise d2">MD Afrid Foisal Opu</text>
    <text x="66" y="215" font-size="28" font-weight="700" fill="url(#accent)" class="rise d3">Full-Stack Web Developer in Progress</text>
    <text x="66" y="255" font-size="20" fill="#cbd5e1" class="rise d4">CSE @ IIUC  •  Founder of Bookeeds</text>
  </g>

  <g>
    <rect x="740" y="45" width="400" height="210" rx="14" fill="#0b1220" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="764" cy="68" r="6" fill="#ff5f56"/>
    <circle cx="784" cy="68" r="6" fill="#ffbd2e"/>
    <circle cx="804" cy="68" r="6" fill="#27c93f"/>
    <g class="m" xml:space="preserve">
      <text x="766" y="112" class="rise l1"><tspan fill="#c084fc">const</tspan> <tspan fill="#38bdf8">afrid</tspan> <tspan fill="#e2e8f0">= {</tspan></text>
      <text x="766" y="137" class="rise l2"><tspan fill="#e2e8f0">  status: </tspan><tspan fill="#86efac">"Building"</tspan><tspan fill="#e2e8f0">,</tspan></text>
      <text x="766" y="162" class="rise l3"><tspan fill="#e2e8f0">  now: </tspan><tspan fill="#86efac">"Bookeeds"</tspan><tspan fill="#e2e8f0">,</tspan></text>
      <text x="766" y="187" class="rise l4"><tspan fill="#e2e8f0">  learning: [</tspan><tspan fill="#86efac">"Next.js"</tspan><tspan fill="#e2e8f0">],</tspan></text>
      <text x="766" y="212" class="rise l5"><tspan fill="#e2e8f0">  openTo: </tspan><tspan fill="#86efac">"Internships"</tspan><tspan fill="#e2e8f0">,</tspan></text>
      <text x="766" y="237" class="rise l6"><tspan fill="#e2e8f0">};</tspan><tspan fill="#38bdf8" class="cursor"> |</tspan></text>
    </g>
  </g>
</svg>
